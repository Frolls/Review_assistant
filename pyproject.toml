[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "review-bot"
version = "0.1.0"
description = "PR-review assistant with OpenAI tool calling and a local review knowledge base"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "arize-phoenix-otel>=0.13.0",
    "fastapi>=0.115.0",
    "openinference-instrumentation-openai>=0.1.35",
    "openai>=2.38.0,<3",
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "redis>=5.0.0",
    "spacy>=3.8.0",
    "structlog>=24.4.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["app*"]
