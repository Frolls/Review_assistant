[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "review-bot"
version = "0.1.0"
description = "PR-review assistant with OpenAI tool calling and a local review knowledge base"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiofiles>=24.1.0",
    "alembic>=1.13.0",
    "arize-phoenix-otel>=0.13.0",
    "asyncpg>=0.29.0",
    "diskcache>=5.6",
    "fastapi>=0.115.0",
    "llama-index>=0.12.0",
    "llama-index-readers-file>=0.4.0",
    "llama-index-vector-stores-qdrant>=0.4.0",
    "openinference-instrumentation-openai>=0.1.35",
    "openai>=2.38.0,<3",
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
    "pypdf>=5.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.14.0,<1.16",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "spacy>=3.8.0",
    "tenacity>=9.0",
    "structlog>=24.4.0",
    "tiktoken>=0.8.0",
    "tqdm>=4.66",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "testcontainers[postgres]>=4.8.0",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers>=3.0",
]

dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "testcontainers[postgres]>=4.8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
