# Initial deployment-capacity values for the interactive workload.
# They are not per-user quotas and must be reconciled with actual provider limits.
model_list:
  - model_name: gpt-4.1-mini
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_UPSTREAM_API_KEY
      timeout: 8
      rpm: 30
      tpm: 90000

  - model_name: gpt-4.1-mini-fallback
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 10
      rpm: 20
      tpm: 60000

  - model_name: gpt-4.1-mini-local
    litellm_params:
      model: openai/gemma3:4b
      api_base: os.environ/OLLAMA_BASE_URL
      api_key: os.environ/OLLAMA_API_KEY
      timeout: 20
      rpm: 10
      tpm: 30000

router_settings:
  fallbacks:
    - {"gpt-4.1-mini": ["gpt-4.1-mini-fallback"]}
    - {"gpt-4.1-mini-fallback": ["gpt-4.1-mini-local"]}

litellm_settings:
  master_key: sk-review-bot-local
  json_logs: true
  drop_params: true
