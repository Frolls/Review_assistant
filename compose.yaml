services:
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data
    restart: unless-stopped

  app:
    image: llm-service:v1
    build:
      context: .
      dockerfile: Dockerfile
      target: tracing
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/review_bot
      CHAT_REPOSITORY: postgres
      ADMIN_TOKEN: ${ADMIN_TOKEN:-changeme-admin}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      OBSERVABILITY_INCLUDE_CONTENT: ${OBSERVABILITY_INCLUDE_CONTENT:-true}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key}
      # Calibrated for the bundled qwen3-embedding:4b configuration.
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-0.5}
    command:
      - sh
      - -c
      - python scripts/ingest.py data/ && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      phoenix:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    # Required on Linux when the backend runs on the host, for example local Ollama.
    # Harmless for remote OpenAI-compatible backends because the alias is unused unless referenced.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
      - ingestion_storage:/app/var/ingestion
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/ready", timeout=5)
      interval: 15s
      timeout: 5s
      retries: 5
      # The first start indexes the bundled corpus with a local 4B embedding
      # model before Uvicorn starts. Subsequent UPSERT runs are immediate.
      start_period: 5m
    restart: unless-stopped

  eval:
    profiles: ["eval"]
    # Root is scoped to this one-shot container. With rootless Podman it maps
    # to the invoking host user and can write bind-mounted eval artifacts.
    user: "0:0"
    build:
      context: .
      dockerfile: Dockerfile
      target: eval
    env_file:
      - .env
    environment:
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key}
      OBSERVABILITY_INCLUDE_CONTENT: "true"
    command: ["python", "scripts/verify_eval.py"]
    depends_on:
      phoenix:
        condition: service_started
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app/app:ro
      - ./data:/app/data:ro
      - ./eval:/app/eval:ro
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro
      - ./tests/eval:/app/tests/eval
      - ./docs:/app/docs

  bot:
    build:
      context: ../telegram-review-bot
      dockerfile: Dockerfile
    env_file:
      - ../telegram-review-bot/.env
    environment:
      BACKEND_URL: http://app:8000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-changeme-admin}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.14.1
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key}
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c '</dev/tcp/127.0.0.1/6333'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: review_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d review_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  app_data: {}
  ingestion_storage: {}
  phoenix-data: {}
  pg-data: {}
  qdrant_storage: {}
  redis_data: {}
