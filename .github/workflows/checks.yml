name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_review
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install '.[dev,tracing]'
      - run: python -m nltk.downloader stopwords punkt_tab
      - run: ruff check --no-cache app tests scripts integration
      - run: python scripts/recompute_verification.py --verify-only
      - run: python -m pytest -q
        env:
          OPENAI_API_KEY: test-key
          PHOENIX_TRACING_ENABLED: "false"
          TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_review
